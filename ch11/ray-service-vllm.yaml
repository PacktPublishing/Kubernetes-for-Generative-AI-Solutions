# Serve Llama 3.1 8B Instruct with vLLM behind Ray Serve on KubeRay.
#
# This manifest was reworked for current Ray/KubeRay releases:
#   * The old config pulled a `working_dir` zip from KubeRay `master` and
#     imported `ray-operator.config.samples.vllm.serve:model`. That sample no
#     longer exists upstream (only the TPU variant remains), so the RayService
#     could never become ready.
#   * `rayproject/ray-ml` images are no longer published. Ray now ships
#     `rayproject/ray-llm`, which bundles vLLM, so no runtime pip install is
#     needed and the pod starts far faster.
#   * Ray Serve LLM's `build_openai_app` exposes an OpenAI-compatible API
#     (/v1/chat/completions, /v1/completions, /v1/models).
#
# The cu130 image needs an NVIDIA driver >= 580. The EKS 1.36 AL2023 NVIDIA
# AMI ships 580.178.04, so g6 (L4) nodes from this book's GPU node pool work
# as-is.
#
# Create the Hugging Face token secret first, and make sure the token has
# been granted access to the gated meta-llama repo:
#   kubectl create secret generic hf-secret \
#     --from-literal=hf_api_token=hf_xxxxxxxxxxxxxxxx
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: llama-31-8b
spec:
  serveConfigV2: |
    applications:
    - name: llm
      route_prefix: /
      import_path: ray.serve.llm:build_openai_app
      args:
        llm_configs:
        - model_loading_config:
            model_id: meta-llama/Llama-3.1-8B-Instruct
            model_source: meta-llama/Llama-3.1-8B-Instruct
          engine_kwargs:
            dtype: bfloat16
            max_model_len: 8192
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.90
          deployment_config:
            autoscaling_config:
              min_replicas: 1
              max_replicas: 5
              target_ongoing_requests: 32
            max_ongoing_requests: 64
  rayClusterConfig:
    rayVersion: "2.58.0"
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        # Keep model replicas off the head node.
        num-gpus: "0"
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray-llm:2.58.0-py312-cu130
            resources:
              limits:
                cpu: "2"
                memory: "8Gi"
              requests:
                cpu: "2"
                memory: "8Gi"
            ports:
            - containerPort: 6379
              name: gcs-server
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            - containerPort: 8080
              name: metrics
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 5
      groupName: gpu-group
      rayStartParams: {}
      template:
        spec:
          containers:
          - name: llm
            image: rayproject/ray-llm:2.58.0-py312-cu130
            env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            resources:
              limits:
                cpu: "8"
                memory: "40Gi"
                nvidia.com/gpu: "1"
              requests:
                cpu: "8"
                memory: "40Gi"
                nvidia.com/gpu: "1"
          # The GPU nodes created in Chapter 6 carry this taint.
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
